# nginx-конфиг для georgiy-devops.ru
# Установка: см. deploy/README.md. Пути к сертификатам — стандартные для certbot,
# сверь с текущим конфигом на сервере перед заменой.

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name georgiy-devops.ru www.georgiy-devops.ru;

    server_tokens off;

    # ACME challenge для продления сертификата certbot (webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://georgiy-devops.ru$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.georgiy-devops.ru;

    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/georgiy-devops.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/georgiy-devops.ru/privkey.pem;

    return 301 https://georgiy-devops.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name georgiy-devops.ru;

    # Не раскрывать версию nginx и ОС в заголовке Server и на страницах ошибок
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/georgiy-devops.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/georgiy-devops.ru/privkey.pem;

    # Только TLS 1.2/1.3, современные шифры (Mozilla "intermediate")
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/resume;
    index index.html;
    charset utf-8;

    # Статический сайт: только GET/HEAD, остальное — 405
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Не отдавать скрытые файлы (.git, .env и т.п.), если они случайно попадут в webroot
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Скрипты и служебные файлы деплоя в webroot не нужны
    location ~* \.(sh|conf|md|bak|old|orig|swp)$ {
        return 404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Шрифты, картинки, CSS/JS: долгий кэш
    location ~* \.(woff2|webp|png|svg|css|js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
    }
}
