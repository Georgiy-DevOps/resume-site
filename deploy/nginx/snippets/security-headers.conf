# Security-заголовки сайта-резюме. Подключается в КАЖДЫЙ location с add_header:
# nginx не наследует add_header из server, если в location есть свой add_header.

# HSTS: браузер ходит только по HTTPS год. preload — только когда уверен в HTTPS на всех поддоменах.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# CSP: скрипты и шрифты только свои; data: нужен для встроенных скриншотов и favicon.
# 'unsafe-inline' оставлен только для стилей (inline style-атрибуты в вёрстке), не для скриптов.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
