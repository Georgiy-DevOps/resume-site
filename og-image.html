<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  background: #0a0f0d;
  font-family: 'Space Grotesk', system-ui, sans-serif;
  color: #dce8e0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(52,211,153,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(52,211,153,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
}
.glow {
  position: absolute;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(52,211,153,0.12) 0%, transparent 70%);
  top: -100px;
  right: -50px;
  border-radius: 50%;
}
.card {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 60px;
  padding: 0 80px;
}
.photo {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  border: 3px solid #34d399;
  object-fit: cover;
  flex-shrink: 0;
}
.info { display: flex; flex-direction: column; gap: 16px; }
.eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #34d399;
}
h1 { font-size: 72px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.pillars { display: flex; gap: 24px; margin-top: 8px; }
.pillar {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #7a8f82;
  display: flex;
  align-items: center;
  gap: 8px;
}
.pillar::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #34d399;
}
.pillar:nth-child(2)::before { background: #e8c87a; }
.sub {
  font-family: 'Source Serif 4', Georgia, serif;
  font-style: italic;
  font-size: 20px;
  color: #7a8f82;
  margin-top: 8px;
  max-width: 500px;
  line-height: 1.5;
}
.line {
  position: absolute;
  bottom: 60px;
  left: 80px;
  right: 80px;
  height: 1px;
  background: linear-gradient(90deg, #34d399, transparent);
}
.url {
  position: absolute;
  bottom: 30px;
  right: 80px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: #7a8f82;
  letter-spacing: 0.04em;
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;1,400&display=swap">
</head>
<body>
<div class="grid"></div>
<div class="glow"></div>
<div class="card">
  <img class="photo" src="photo.webp" alt="">
  <div class="info">
    <div class="eyebrow">DevOps Engineer / Moscow</div>
    <h1>Georgiy</h1>
    <div class="pillars">
      <span class="pillar">Infrastructure</span>
      <span class="pillar">Security</span>
      <span class="pillar">Monitoring</span>
    </div>
    <p class="sub">Production servers. Observability stack. Automotive embedded systems.</p>
  </div>
</div>
<div class="line"></div>
<div class="url">resume &middot; 2026</div>
</body>
</html>
